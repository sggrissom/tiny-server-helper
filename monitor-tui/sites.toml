# Monitor TUI Configuration
# Copy this file to one of the following locations:
#   - ./sites.toml (current directory)
#   - ~/.config/monitor/sites.toml
#   - /etc/monitor/sites.toml

[settings]
refresh_interval = 5        # Seconds between checks
history_size = 100          # Number of data points to keep per site
request_timeout = 3         # HTTP request timeout in seconds
theme = "high-contrast"

# Alert configuration
[settings.alerts]
enabled = true
terminal_bell = true
desktop_notifications = true
alert_history_size = 200
consecutive_failures = 2
cooldown_seconds = 300

[settings.alerts.transitions]
up_to_down = true
down_to_up = true
warn_to_down = true
warn_to_up = true
up_to_warn = true
down_to_warn = false

[server_metrics]
url = "https://metrics.grissom.zone/metrics"
poll_interval = 30

# Define your monitored sites below
[[sites]]
name = "Resume Site"
url = "https://stevengrissom.com/healthz"
expected_status = 200

[[sites]]
name = "Family Site"
url = "https://grissom.zone/healthz"
expected_status = 200

[[sites]]
name = "Releve Live"
url = "https://releve.live/healthz"
expected_status = 200

[[sites]]
name = "Chess Stats"
url = "https://chess.grissom.zone/healthz"
expected_status = 200

[[sites]]
name = "Karaoke Maker"
url = "https://karaoke.grissom.zone/healthz"
expected_status = 200

# /readyz, not /healthz: family's /healthz answers ok from a closure that
# touches nothing, so it stays green through an unreadable database or an
# unwritable static directory. /readyz opens a bolt transaction and round-trips
# a temp file in shared/static/, which is the failure class worth waking up for.
#
# This is the site with the most moving parts of any here — a database, four
# background workers, a WebSocket, a photo pipeline, a face-recognition daemon
# over a Unix socket, APNs — so it alerts on the first failure rather than the
# second.
[[sites]]
name = "Family Record"
url = "https://familyrecord.app/readyz"
expected_status = 200

[sites.alerts]
consecutive_failures = 1
